<!doctype html>
<!-- The share card (public/og.png, 1200x630). Regenerate with: node scripts/og-image.js -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Pixel; src: url('../../node_modules/@fontsource/vt323/files/vt323-latin-400-normal.woff2'); }
  @font-face { font-family: Mono; src: url('../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2'); font-weight: 100 800; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #080c09; overflow: hidden; }
  body { position: relative; font-family: Mono, monospace; color: #c8f7d9; }
  body::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px); pointer-events: none; }
  .frame { position: absolute; inset: 40px; border: 4px solid #1f6b3d; box-shadow: 12px 12px 0 #03140a; background: #0b130e; }
  .bar { height: 44px; background: #1f6b3d; color: #080c09; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font-weight: 700; font-size: 20px; letter-spacing: 0.08em; }
  .body { padding: 46px 56px; }
  .brand { display: flex; align-items: center; gap: 28px; font-family: Pixel; font-size: 128px; line-height: 0.8; color: #4dff9a; text-shadow: 0 0 22px rgba(77,255,154,0.35); }
  .brand b { color: #ffb23e; font-weight: 400; }
  .prompt { margin: 34px 0 14px; font-size: 26px; color: #7fae92; }
  .prompt span { color: #4dff9a; }
  .lines { font-size: 30px; line-height: 1.55; font-weight: 600; }
  .lines div::before { content: '> '; color: #4dff9a; }
  .foot { position: absolute; left: 56px; bottom: 34px; font-size: 22px; color: #7fae92; letter-spacing: 0.06em; }
</style>
</head>
<body>
  <div class="frame">
    <div class="bar"><span>REPOWEEKLY.LOG</span><span>_ □ ×</span></div>
    <div class="body">
      <div class="brand">
        <svg width="112" height="104" viewBox="0 0 60 56" shape-rendering="crispEdges"><g fill="#4dff9a"><rect x="0" y="0" width="10" height="56"/><rect x="10" y="0" width="26" height="10"/><rect x="10" y="24" width="26" height="10"/><rect x="34" y="10" width="10" height="14"/><rect x="24" y="34" width="10" height="10"/><rect x="34" y="44" width="10" height="12"/></g><rect x="48" y="46" width="10" height="10" fill="#ffb23e"/></svg>
        <span>Repo<b>Weekly</b></span>
      </div>
      <p class="prompt"><span>$</span> repoweekly --top 10 --rising --skills</p>
      <div class="lines">
        <div>Top GitHub repos of the week, by stars gained</div>
        <div>Rising AI agent skills, checked before install</div>
        <div>Beginner issues matched to your skills</div>
      </div>
    </div>
    <div class="foot">FREE / NO ADS / NO TRACKING / BUILT ON GITHUB DATA</div>
  </div>
</body>
</html>

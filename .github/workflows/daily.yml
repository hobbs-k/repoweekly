name: Daily snapshot

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Daily and weekly runs both write /data and deploy, so they never run at the same time.
concurrency:
  group: data-writes
  cancel-in-progress: false

env:
  # GH_PAT gives 5,000 requests per hour. The built-in token only gives 1,000.
  GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.site.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collect
      - run: npm run snapshot
      # Rising is a bonus page, so a failure here does not stop the snapshot being saved.
      - name: Find the repos that are speeding up
        run: npm run rising
        continue-on-error: true
      # Open tickets for the Contribute page. Also a bonus, so a failure here does not stop the snapshot.
      - name: Collect open issues
        run: npm run issues
        continue-on-error: true
      # The Skills page. It makes AI summaries for the top ten, so it needs the AI key and it is
      # a bonus too: a failure here does not stop the snapshot.
      - name: Find the best skills
        run: npm run skills
        continue-on-error: true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.NVIDIA_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "repoweekly-bot"
          git config user.email "repoweekly-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "[daily] nothing to commit"
          else
            git commit -m "data: daily snapshot $(date -u +%F)"
            git pull --rebase
            git push
          fi

      # The rising page changes every day, so the site is rebuilt from the data already
      # committed. No paid call is made here. It is skipped until a week has been ranked
      # and SITE_URL is set.
      - name: Check the site can be built
        id: site
        run: |
          if [ -f data/latest.json ] && [ -n "$SITE_URL" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "[daily] skipping the deploy: no ranked week yet or SITE_URL not set"; fi
      - name: Build the site
        if: steps.site.outputs.ok == 'true'
        run: npm run feeds && npm run validate && npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ok == 'true'
        with:
          path: dist

  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
